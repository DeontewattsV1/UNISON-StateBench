name: Playground and evidence schema

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  playground:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: playground
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Unit tests
        run: npm test
      - name: Build
        run: npm run build
      - name: Headless smoke test
        run: npm run smoke
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Validate evidence-record example against schema
        run: |
          python -m pip install --quiet jsonschema
          python -c "import json,jsonschema; s=json.load(open('../schemas/evidence-record.schema.json')); jsonschema.Draft202012Validator.check_schema(s); jsonschema.validate(json.load(open('../schemas/examples/evidence-record.example.json')), s); print('schema ok')"
