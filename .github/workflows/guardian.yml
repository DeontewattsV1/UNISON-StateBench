name: Verify Guardian

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: guardian
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: guardian/package-lock.json
      - run: npm ci
      - run: npm test
      - run: npm run build:worker
      - run: npm run test:worker
      - run: npx playwright install --with-deps chromium
      - name: Browser workflow against the public Worker runtime
        run: |
          npm run dev:worker -- --ip 127.0.0.1 --port 8787 > /tmp/guardian-worker.log 2>&1 &
          worker_pid=$!
          trap 'kill "$worker_pid" 2>/dev/null || true' EXIT
          for attempt in {1..60}; do
            if curl --fail --silent http://127.0.0.1:8787/api/health > /dev/null; then break; fi
            sleep 1
          done
          curl --fail --silent http://127.0.0.1:8787/api/health
          BROWSER_TEST_URL=http://127.0.0.1:8787 npm run test:browser
